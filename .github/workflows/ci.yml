name: Offline research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12.12', '3.14.7']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/snapshot.py
      - run: python scripts/validate.py
      - run: python scripts/result_figure.py --check
      - run: python scripts/readme_table.py --check
      - run: python -m compileall -q strc scripts tests
